<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#0f0006;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;overflow:hidden}
  .bg{position:absolute;inset:0;background-image:radial-gradient(ellipse 13px 8px at 20px 18px,rgba(100,55,0,.7) 70%,transparent),radial-gradient(ellipse 8px 13px at 40px 13px,rgba(100,55,0,.7) 70%,transparent),radial-gradient(ellipse 11px 7px at 17px 34px,rgba(100,55,0,.7) 70%,transparent),radial-gradient(ellipse 7px 11px at 38px 36px,rgba(100,55,0,.7) 70%,transparent),radial-gradient(circle 9px at 28px 25px,rgba(55,25,0,.4) 70%,transparent),radial-gradient(ellipse 13px 8px at 80px 63px,rgba(100,55,0,.7) 70%,transparent),radial-gradient(ellipse 8px 13px at 100px 58px,rgba(100,55,0,.7) 70%,transparent),radial-gradient(ellipse 11px 7px at 78px 79px,rgba(100,55,0,.7) 70%,transparent),radial-gradient(ellipse 7px 11px at 99px 81px,rgba(100,55,0,.7) 70%,transparent),radial-gradient(circle 9px at 89px 70px,rgba(55,25,0,.4) 70%,transparent);background-size:170px 120px}
  .card{position:relative;z-index:1;text-align:center;padding:2rem}
  .emoji{font-size:80px;display:block;margin-bottom:1rem}
  .title{font-size:52px;font-weight:700;background:linear-gradient(135deg,#FFB6C1,#FF1493,#722F37,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.5rem;letter-spacing:2px}
  .name{font-size:36px;color:#fff;margin-bottom:1rem;text-shadow:0 0 30px rgba(255,20,147,.7)}
  .sub{font-size:22px;color:rgba(255,255,255,.55);font-style:italic}
  .bar{position:absolute;left:0;right:0;height:22px;background-color:#c8841e;background-image:radial-gradient(ellipse 6px 4px at 10px 8px,#3a1800 100%,transparent),radial-gradient(ellipse 4px 6px at 18px 3px,#3a1800 100%,transparent),radial-gradient(ellipse 5px 4px at 4px 16px,#3a1800 100%,transparent),radial-gradient(ellipse 4px 5px at 15px 19px,#3a1800 100%,transparent),radial-gradient(ellipse 6px 4px at 40px 5px,#3a1800 100%,transparent),radial-gradient(ellipse 4px 6px at 50px 12px,#3a1800 100%,transparent);background-size:100px 22px}
  .bar.top{top:0}.bar.bot{bottom:0}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="bar top"></div>
  <div class="card">
    <span class="emoji">🎂</span>
    <div class="title">HAPPY BIRTHDAY</div>
    <div class="name">Melinda Az Zahra Hamid</div>
    <div class="sub">Ada pesan cinta spesial untukmu 💌</div>
  </div>
  <div class="bar bot"></div>
</body>
</html>
